name: Quality checks

on:
  push:
    branches:
      - main
      - rebuild/full-app-quality-pass
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test

      - name: Verify deployed Worker after main-branch updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_ORIGIN: https://revised-finanx.stock-analyser-2026.workers.dev
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$WORKER_ORIGIN/api/health"
          curl --fail --silent --show-error "$WORKER_ORIGIN/" --output /tmp/finanx-home.html
          grep -Fq "Stocks to explore" /tmp/finanx-home.html
          grep -Fq "home-featured-cards" /tmp/finanx-home.html
          grep -Fq "Market Scan" /tmp/finanx-home.html
          ! grep -Fq "Market Activity" /tmp/finanx-home.html
